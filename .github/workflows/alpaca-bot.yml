name: Alpaca Trading Bot

on:
  # Sole trigger: cron-job.org hits this workflow_dispatch endpoint every 15 min
  # during market hours (America/Chicago). The GitHub-native schedule was removed
  # so the two don't double-fire (which risks duplicate orders). The bot's own
  # 9:45–3:55 ET gate is the real control.
  workflow_dispatch:
    inputs:
      email_test:
        description: "Send a test email and exit"
        type: boolean
        default: false
      order_test:
        description: "Place a $1 paper test order and exit (paper only)"
        type: boolean
        default: false
      account_test:
        description: "READ-ONLY connection check (safe on live) and exit"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run at a time — stops overlapping runs from racing to commit trade_log.jsonl
# (the cause of the intermittent "job cancelled" emails). In-progress runs finish;
# a new trigger queues behind them. Trading is unaffected either way.
concurrency:
  group: alpaca-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 14   # runs target ~12 min (setup + ~9.5m fast loop). 14 is a
                          # backstop that still finishes BEFORE the next 15-min
                          # trigger, so a pathological run can't overlap and pile up.
    permissions:
      contents: write   # allow committing trade_log.jsonl back to the repo
      actions: write    # allow dispatching brief.yml when the plan is stale
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # GitHub's native cron (brief.yml) regularly fires hours late or not at all
      # (skipped entirely on 2026-06-10). cron-job.org triggers THIS workflow
      # reliably — so bootstrap the brief from here: if daily_plan.json isn't
      # today's, dispatch it. The bot trades neutral this run and picks up the
      # fresh plan next run (15 min later).
      - name: Ensure fresh research brief
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=America/New_York date +%F)
          plan_date=$(python3 -c "import json; print(json.load(open('daily_plan.json')).get('date',''))" 2>/dev/null || echo "none")
          if [ "$plan_date" != "$today" ]; then
            echo "plan stale ($plan_date != $today) — dispatching brief.yml"
            gh workflow run brief.yml --repo "$GITHUB_REPOSITORY" || true
          else
            echo "plan is fresh ($plan_date)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-alpaca.txt

      - name: Install dependencies
        run: pip install -r requirements-alpaca.txt

      - name: Run Alpaca bot
        env:
          # A/B ARM SELECTOR. 2026-08-22 STRATEGY SWAP (Devon): Alpaca now runs the
          # HYBRID and Robinhood runs plain index. Rationale: the hybrid's stops must
          # be honoured within minutes, and Alpaca's REST API is the only execution
          # path here that is reliable enough for that. Robinhood's agentic bridge had
          # 3 outages / 291 min in one week, which is survivable for buy-and-hold and
          # not for stop enforcement. "false" => full hybrid.
          STRATEGY_INDEX_ONLY: "false"
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    ${{ secrets.ALPACA_BASE_URL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          EMAIL_TEST:         ${{ inputs.email_test }}
          ORDER_TEST:         ${{ inputs.order_test }}
          ACCOUNT_TEST:       ${{ inputs.account_test }}
        run: python alpaca_bot.py

      # The watchdog's own workflow uses GitHub-native cron, which skips slots
      # (documented failure mode — the same reason the bot itself is triggered by
      # cron-job.org). On 2026-08-13 a 51-minute laptop outage during market hours
      # fell entirely inside a skipped slot and Devon got NO alert; he noticed
      # before the monitoring did. So the reliably-triggered bot job now ALSO runs
      # the check, gated to the :00/:30 triggers to keep the intended ~30-min
      # cadence (the watchdog has no alert dedup, so every-15-min would double the
      # texts during an outage). The native-cron workflow stays as a backup.
      # if: always() — a failing bot step must not skip laptop monitoring.
      - name: RH laptop watchdog (piggyback on the reliable trigger)
        if: always()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          SMS_TO:             ${{ secrets.SMS_TO }}
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          m=$(date -u +%M)
          if [ $((10#$m % 30)) -lt 15 ]; then
            python rh_watchdog.py || echo "watchdog check errored (non-fatal for trading)"
          else
            echo "off-slot trigger (:$m) — watchdog runs on the :00/:30 slots"
          fi

      # Slack READ side (Devon 2026-08-25: "should be able to communicate in slack
      # with the others"). The webhook can only post; this pulls his replies back
      # and files them into AGENT_MAIL.md, which is still the channel of record.
      # Rides the same reliable 15-min trigger the watchdog piggybacks on. Silent
      # no-op until SLACK_BOT_TOKEN + SLACK_CHANNEL_ID exist. Commits on its own so
      # a relayed message is never mislabelled as a trade.
      - name: Pull Slack messages into the mailbox
        if: always()
        env:
          SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python slack_notify.py --pull-ingest 25 || echo "slack pull errored (non-fatal)"
          if [ -n "$(git status --porcelain -- AGENT_MAIL.md)" ]; then
            git config user.name  "alpaca-bot"
            git config user.email "alpaca-bot@users.noreply.github.com"
            git add -- AGENT_MAIL.md
            git commit -m "AGENT_MAIL: relay Slack messages from Devon $(date -u +%FT%TZ)"
            git push || (git pull --rebase --autostash origin main && git push) || true
          fi

      - name: Persist trade log + holds ledger
        if: always()
        run: |
          changed=""; trades=""
          for f in trade_log.jsonl holds.json status.json; do
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              git add -- "$f"; changed=1
              # status.json updates every run (the monitoring heartbeat); only
              # trade_log/holds changing means an actual order. Label honestly so
              # the history isn't 30+ "trade log" commits that were really just
              # heartbeats (which reads like the bot went haywire).
              [ "$f" != "status.json" ] && trades=1
            fi
          done
          if [ -n "$changed" ]; then
            git config user.name  "alpaca-bot"
            git config user.email "alpaca-bot@users.noreply.github.com"
            if [ -n "$trades" ]; then msg="trade log $(date -u +%FT%TZ)"; else msg="status heartbeat $(date -u +%FT%TZ)"; fi
            git commit -m "$msg"
            git push || (git pull --rebase --autostash origin main && git push) || true
          else
            echo "nothing to persist"
          fi
