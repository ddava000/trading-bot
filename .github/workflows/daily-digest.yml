name: DAILY DIGEST

# A once-a-day summary of both bots, sent by GitHub. Devon 2026-10-17 retired the two scheduled Claude
# sessions that used to post one (BOT DAILY CHECK froze on 2026-10-14 and skipped two days unnoticed, LAPTOP
# BOT DAILY CHECK was killed by the shared Claude session limit the same afternoon) and asked for this
# instead: a script on a runner that has no session to freeze and no quota to run out. See daily_digest.py.
#
# ANY trigger below may send it; the rule is the same for all of them: the bot's session is over, and no run
# of THIS workflow has already completed the "Send the daily digest" step today. GitHub is the record of what
# was sent; nothing is stored in the repo. A failed send leaves that step red, so the next trigger retries.
# The usual trigger is the last Arm A run of the day, which starts at 15:45 ET and finishes about 15:55:45,
# just after the bot's close. (The first version waited 10 minutes past the close, which that run can never
# reach, so on 2026-10-19 the digest went out only through the schedule, three hours late.)
#
# One concurrency group, no cancel-in-progress: runs are serialised so two triggers in the same minute
# cannot both send. GitHub keeps only one PENDING run per group, which is harmless here because every run is
# equivalent (a newer one makes the same decision). Do not copy this to the watchers: a dropped pending run
# once silently lost a MAILBOX NOTIFY, and ARM A WATCH deliberately has no group.
on:
  workflow_run:
    workflows: ["Alpaca Trading Bot", "Research Brief (morning + intraday)"]
    types: [completed]
  schedule:
    - cron: "10 20 * * 1-5"      # 16:10 ET in summer time
    - cron: "40 21 * * 1-5"      # a second chance; GitHub throttles crons
  workflow_dispatch:
    inputs:
      force:
        description: "no = only if a digest is due. yes = send one now (a test)."
        type: choice
        options: ["no", "yes"]
        default: "no"

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read
  actions: read          # list today's runs of every workflow and this workflow's own send steps

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 400     # the laptop's rh_status.json history for the last few days
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: Decide whether a digest is due
        id: decide
        env:
          GH_TOKEN:           ${{ github.token }}
          FORCE_DIGEST:       ${{ inputs.force }}
        run: python daily_digest.py --decide
      - name: Send the daily digest
        if: steps.decide.outputs.due == 'true'
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        ${{ secrets.ALERT_EMAIL }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN:           ${{ github.token }}
        run: python daily_digest.py --send
