name: AGENT_MAIL daily check

# Daily mailbox check for the sessions that cannot check themselves every day.
# audit is a WEEKLY job, so it structurally could not meet Devon's 2026-08-23
# "all three check at least daily" rule. cloud has a weekday Claude task, so its
# gap is WEEKENDS specifically -- and audit posts on Sundays, so that gap is real. It runs mail_check.py, NOT a Claude session, so it costs
# nothing: stdlib only, no model call, no broker keys.
#
# STATELESS on purpose (--since-hours 24). A GitHub runner is fresh every time, so a
# state file would never exist, every run would look like a first run, and it would
# silently adopt the backlog and never report anything. "Addressed to me in the last
# 24h" is the same question a daily check is asking anyway.
#
# GitHub-native cron skips slots in this repo (documented; it is why the bot itself
# is triggered by cron-job.org). Tolerable here: a missed day delays a notification,
# it cannot miss a trade or an exit.
#
# WHY NOT PIGGYBACK ON alpaca-bot.yml, which audit suggested and which IS the
# reliable trigger: that workflow only fires on WEEKDAYS during market hours
# (verified against 60 runs: Wed/Thu/Fri only, 13:00-19:45 UTC, never a weekend).
# Riding it therefore cannot close the weekend gap, which is the only gap cloud
# actually has. This 7-day cron can. Cloud additionally reads and ACTS on mail via
# its weekday Claude task, so on weekdays this step is a cheap backstop that also
# catches that task silently failing.

on:
  schedule:
    - cron: "0 13 * * *"   # daily 13:00 UTC = 08:00 CT
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ONE step, ONE digest email covering both sessions. Was two steps sending
      # two separate emails; combined with the laptop daemon's own notifier that put
      # Devon on three notification paths for a single file, all saying the same
      # thing on a busy day. mail_check.py --for a,b reports per-session sections in
      # one message and only includes a section for a session that actually has mail.
      #
      # Losing the independent-failure property of two steps is acceptable: the two
      # checks parse the SAME file in the SAME process, so there is no realistic
      # failure that hits one addressee and not the other. A crash now loses both,
      # which is why the step still reports loudly rather than swallowing errors.
      #
      # STATELESS --since-hours on purpose: a runner is fresh every time, so a state
      # file would never exist and every run would silently adopt the backlog and
      # report nothing (fd37d07).
      - name: Check AGENT_MAIL for entries addressed to audit or cloud
        if: always()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # exit 1 means "new mail found and emailed", which is success here.
          python mail_check.py --for audit,cloud --since-hours 24 || true
