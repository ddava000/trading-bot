name: AGENT_MAIL daily check

# The audit session is a WEEKLY job, so it was the one session that structurally
# could not meet Devon's 2026-08-23 "all three check at least daily" rule. This is
# its daily trigger. It runs mail_check.py, NOT a Claude session, so it costs
# nothing: stdlib only, no model call, no broker keys.
#
# STATELESS on purpose (--since-hours 24). A GitHub runner is fresh every time, so a
# state file would never exist, every run would look like a first run, and it would
# silently adopt the backlog and never report anything. "Addressed to me in the last
# 24h" is the same question a daily check is asking anyway.
#
# GitHub-native cron skips slots in this repo (documented; it is why the bot itself
# is triggered by cron-job.org). Tolerable here: a missed day delays a notification,
# it cannot miss a trade or an exit. If it proves too lossy, move it onto the
# alpaca-bot.yml trigger the way rh_watchdog already rides it.

on:
  schedule:
    - cron: "0 13 * * *"   # daily 13:00 UTC = 08:00 CT
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check AGENT_MAIL for entries addressed to audit
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # exit 1 means "new mail found and emailed", which is success here.
          python mail_check.py --for audit --since-hours 24 || true
