name: RH laptop watchdog

# Cloud dead-man's-switch for the Robinhood laptop bot. Owned by the laptop
# session (monitors rh_status.json / rh_watchdog.py) but lives here because a
# watchdog must run independently of the laptop. Additive; touches no other
# workflow. See rh_watchdog.py for the logic.

on:
  schedule:
    # Every 30 min, 13:00-21:00 UTC, weekdays. That brackets 9:30-16:00 ET in
    # both EST and EDT; rh_watchdog.py's check_market() is the precise gate, so
    # off-hours runs just exit 0. While the bot is down you get pinged each run.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:      # manual run; set force=true to send a test alert now
    inputs:
      force:
        description: "Send a TEST alert to all channels regardless of bot state"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests
      - name: Check laptop bot liveness and alert if silent
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          SMS_TO:             ${{ secrets.SMS_TO }}
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          FORCE_ALERT:        ${{ inputs.force }}
        run: python rh_watchdog.py
